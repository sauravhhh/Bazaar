<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f7f7f8;--card:#fff;--text:#141414;--muted:#777;--line:#e8e8ea;--green:#01875f}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px 10px}
.brand{font-size:22px;font-weight:800;letter-spacing:-.02em}
.brand small{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}
.search{margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:24px;padding:10px 16px}
.search input{border:none;background:none;outline:none;flex:1;font-size:15px;color:var(--text)}
#cats{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:5;scrollbar-width:none}
#cats::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 14px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
.chip b{font-weight:400;opacity:.7;margin-left:4px}
.chip.on{background:#141414;color:#fff;border-color:#141414}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:4px 16px 40px;max-width:1100px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;transition:transform .12s}
.card:active{transform:scale(.97)}
.icon{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-size:28px;font-weight:800;color:#fff;background:var(--c,#888);position:relative;overflow:hidden;margin-bottom:10px}
.icon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.name{font-size:14px;font-weight:700;line-height:1.25;margin-bottom:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cat{font-size:11px;color:var(--green);font-weight:700;margin-bottom:4px}
.desc{font-size:12px;color:var(--muted);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;flex:1}
#empty{text-align:center;color:var(--muted);padding:60px 20px;grid-column:1/-1;display:none}
@media(min-width:700px){main{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}}
</style>
